<VirtualHost *:80>
    ServerName wms.zeveph.com

    # Proxy to Node.js backend (which also serves the built React frontend)
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    ErrorLog  ${APACHE_LOG_DIR}/wms_error.log
    CustomLog ${APACHE_LOG_DIR}/wms_access.log combined

RewriteEngine on
RewriteCond %{SERVER_NAME} =wms.zeveph.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# HTTPS block is added automatically by Certbot — run:
#   sudo certbot --apache -d wms.zeveph.com
# It will append a <VirtualHost *:443> block with SSL settings.
#
# Required Apache modules (enable once):
#   sudo a2enmod proxy proxy_http headers rewrite
#   sudo systemctl restart apache2
